<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLXN - Visual Workflow Canvas & Planner</title>
    <meta name="description" content="Minimalist visual project planner and workflow canvas for spatial brainstorming, pipelines, mind maps, and milestone tracking." />
    <meta property="og:title" content="PLXN - Visual Workflow Canvas & Planner" />
    <meta property="og:description" content="Minimalist visual project planner and workflow canvas for spatial brainstorming, pipelines, mind maps, and milestone tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        var theme = localStorage.getItem('plxn_theme_mode');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#FBFBF9] dark:bg-[#141416] text-neutral-900 dark:text-neutral-100 antialiased overflow-hidden selection:bg-neutral-200 dark:selection:bg-neutral-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
